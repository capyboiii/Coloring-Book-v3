process:
  pure_bw: false
prompts:
  page: 'A black and white line-art coloring page illustration for {audience_desc}.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing, no outline
    along the edges of the image. The white background must extend cleanly around
    the artwork.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number, signature,
    watermark or logo.

    Line work: pure black outlines on a pure white background, {page_line_style}

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Vertical portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp
    vector-like edges.

    '
  cover_style: 'soft watercolor style mixed with realistic details, vibrant yet soft
    pastel colors, warm and charming atmosphere, dreamy lighting, highly detailed,
    eye-catching, aesthetic, high quality illustration. - LINEWORK: keep clean, crisp
    black outlines defining all characters and elements, matching the line-art style
    inside the coloring book. - A warm cream / soft ivory background, not stark white.
    - The colouring is professionally graded, luminous and cohesive, polished and
    premium, never flat, muddy, dull, garish or neon. '
  front_cover: 'A vibrant, full-colour FRONT COVER illustration for {audience_article}
    {audience_adj} coloring book.


    THIS BOOK''S SUBJECT - build the cover only from this:

    {subject_hint}

    Every character, creature and object must belong to that subject. Do NOT add a
    fox, a

    rabbit, a bear, a squirrel, a deer or an owl unless it genuinely belongs, and
    never a different species.

    KEEP IT SIMPLE - FEW CHARACTERS: feature only a SMALL focal group, about ONE to
    THREE main characters total, drawn large, clear and charming. Do NOT crowd the
    cover with many repeated characters, and do NOT fill empty space by adding extra
    copies of the subject. A clean, uncluttered composition with a strong focal point
    is the goal. Do NOT fall back on a generic green forest or flower meadow unless
    the

    scenes above are actually set there.


    LAYOUT: {cover_layout}


    COMPOSITION - arrange the cover in whatever way looks most beautiful, charming
    and eye-catching for a coloring book cover. You are FREE to choose the layout:
    it may be a single unified scene, OR a tasteful grouped arrangement / soft vignette
    composition - for example the main characters gathered together as a lovely group,
    with smaller supporting characters, props or gentle decorative vignettes softly
    arranged around them.

    Whatever layout you pick, keep the WHOLE cover visually COHESIVE: one consistent
    art style, one colour palette and one light mood throughout, so it reads as ONE
    polished, harmonious design - not random, clashing clip-art. Avoid an ugly rigid
    grid of hard boxes or a messy scrapbook; any groupings or vignettes should blend
    softly and pleasingly into each other or into a shared background.

    ONE CONTINUOUS PICTURE - IMPORTANT: the whole cover must be a SINGLE continuous
    illustration on one shared background. Do NOT split it into separate horizontal
    bands, strips, header bars, panels or boxed-off sections, and do NOT draw any
    dividing line, rule, seam or inner frame that cuts the artwork into pieces. The
    top of the cover flows into the middle and bottom as one seamless image; grouped
    characters and soft vignettes may sit within it but must NOT become separate fenced-off
    compartments.


    TITLE "{title}" - spell it EXACTLY, letter for letter. Draw it as a real object
    living

    inside this scene, not as text laid on top: the same bold black hand-drawn outline,
    the

    same coloured-pencil shading and the same palette as the artwork.


    KEEP THE TITLE CLEAN AND SEPARATE: NO flowers, leaves, vines, branches, tendrils
    or motifs may weave through, overlap, touch or cover any letter. The lettering
    stands completely clear of all foliage, with clean breathing space around the
    words so every letter reads instantly. Scenery may sit BEHIND the title band,
    but nothing may cross in FRONT of the letters or grow onto them.


    Place the title in the upper part of the cover, with a clear band of illustration

    ABOVE it at least as tall as one line of the lettering, so artwork is always the
    first

    thing at the top. Never let a letter touch or come near any edge. If the title
    is long,

    break it into two or three shorter centred lines.


    KEEP IT READABLE THE RIGHT WAY: give the letters a thick dark outline and strong
    solid

    colour so they stand out against a fully detailed background, the way hand-painted

    lettering reads on a mural. NEVER whiten, fade, blur, lighten, empty or simplify
    anything

    behind or around the words, in ANY shape - no white patch, no cloud, no oval,
    no halo, no

    glow, no mist, no panel, no banner, no box, no drop shadow.


    FULL BLEED - IMPORTANT: the illustration and its coloured background must fill
    the ENTIRE cover completely, running right off all four edges (full bleed). Do
    NOT draw any border, outline, frame, keyline, rectangle or box around the cover,
    and do NOT leave any empty margin, blank strip or unpainted band along ANY edge
    - no plain cream/white border of any kind. Colour reaches every corner. Only the
    main characters and their faces stay comfortably in from the very edges.


    ART STYLE: {style}


    Draw ONLY the illustration and the title. No border, no frame, no outline box,
    no keyline, no guide lines, no dashed lines, no crop marks,

    no rulers, no labels, no captions, no annotations, no barcode, no ISBN, no price,
    no logo,

    no author name, no watermark, and no words of any kind other than "{title}".


    Vertical portrait orientation, aspect ratio 8.625:11.25, maximum resolution.'
  nudge: 'Generate the image now. Output only the image itself, with no explanation
    and no text in your reply. '
  back_cover: 'THIS IS THE BACK COVER (REAR COVER OF THE BOOK).


    Generate the matching BACK COVER for the {audience_adj} coloring book.


    CRITICAL RULE - ABSOLUTELY NO TEXT: this BACK COVER must contain ZERO words, ZERO

    letters, ZERO numbers and ZERO headings. Do NOT repeat the book title. Do NOT
    draw a

    barcode, an ISBN, a price box, a publisher logo, an author name, a watermark,
    a label

    or any annotation. Pure illustration artwork only, nothing else.


    MATCHING ART STYLE & COLOUR: MUST use EXACTLY the same art style, colour palette

    ({style}), line weight, and character design as the front cover to form a seamless

    matching set.


    CAST RULE - STRICT: every character and creature must belong to the subject of
    this

    book, exactly the same cast as the front cover. Do NOT add a fox, a rabbit, a
    bear, a

    squirrel, a deer, an owl or any other generic storybook animal unless it is genuinely

    part of this book''s subject. Do NOT default to a green forest, a woodland clearing
    or a

    flower meadow unless that is truly this book''s setting.


    COMPLETE EDGE-TO-EDGE ARTWORK - THIS IS THE MOST IMPORTANT RULE: The illustration
    must

    fill the ENTIRE canvas completely, corner to corner, with an even level of finish

    everywhere. Every square inch must be fully drawn and fully coloured.


    STRICTLY FORBIDDEN - do NOT produce any of the following: NO white glow, NO bright

    haze, NO blank white patch, NO empty unpainted area, NO washed-out region, NO
    faded or

    blurred zone, NO soft spotlight, NO vignette, NO radial gradient burst, NO reserved

    blank space of any kind, NO guide lines, NO dashed lines, NO crop marks, NO coloured

    bands or strips along any edge, NO rectangles outlining regions of the page. There
    must

    be NO area that looks unfinished, overexposed, or deliberately left empty. If
    a region

    has few objects, it must still be fully illustrated with background detail such
    as

    wallpaper pattern, sky, foliage or floor, drawn and coloured at the same quality
    as the

    rest.


    COMPOSITION: Create a complementary scene that feels distinct from the front cover
    - a

    charming continuation of the story. Good options: the characters resting at sunset,

    waving goodbye, sleeping cosily under stars, or playing with secondary theme elements.

    Spread interest evenly across the whole image rather than concentrating everything
    in

    one spot. Keep the busiest detail and the characters'' faces away from the very
    corners,

    and let calmer background scenery sit in the corner areas instead.


    Vertical portrait orientation, aspect ratio 8.625:11.25, maximum resolution.'
  previews:
    preview_1: 'Create a flat, FRONT-FACING product image of a paperback coloring
      book cover, shown perfectly straight-on.


      VIEWPOINT - THE MOST IMPORTANT RULE: The cover is a flat upright rectangle facing
      the camera DIRECTLY, exactly parallel to the image plane, with zero perspective.
      This is a head-on / flat-lay view seen straight from the front. All four corners
      are perfect 90-degree square corners. The two vertical edges are exactly vertical
      and parallel; the two horizontal edges are exactly horizontal and parallel.
      ABSOLUTELY NO angle, NO tilt, NO rotation, NO 3D turn, NO foreshortening, NO
      perspective vanishing. Do NOT show the spine, the side, the thickness or the
      stacked page edges - we see ONLY the flat front face, like a flat scan of the
      cover.


      DEPTH: Add ONLY a soft, even drop shadow directly behind the rectangle to hint
      it is a real book, plus optionally a very thin sliver of white page edge along
      the bottom. Nothing else that implies a 3D angle.


      FRAMING: The cover rectangle is centred and occupies about 85 percent of the
      frame, on a pure white seamless background with clean white margin on all four
      sides.


      THE COVER ARTWORK: I have ATTACHED the front cover image. Reproduce that attached
      artwork on the cover FLAT and UNDISTORTED, filling the whole cover exactly as
      in the attached file. Keep the same illustration, characters, colours and title
      wording. Do NOT add, remove, reword or redraw any text, and do NOT invent extra
      illustrations, logos or watermarks. Do NOT rotate, tilt, skew, curve, warp or
      foreshorten the artwork in any way.


      Clean minimalist white-background product shot, sharp focus, high resolution.
      Square 1:1 aspect ratio.'
    preview_2: 'Generate a realistic photograph of an open paperback coloring book
      laying flat on a warm wooden table next to colored pencils and a cup of tea.
      I have ATTACHED the exact image files of the INTERIOR COLORING PAGES. Render
      these attached black-and-white line-art pages printed clearly on the open left
      and right pages of the book with 100% exact visual fidelity. MANDATORY REQUIREMENT:
      Each printed page illustration MUST include the crisp, solid black rectangular
      border frame box enclosing the artwork, exactly as shown in the attached files.
      Square 1:1 aspect ratio.'
    preview_3: 'Generate a close-up photograph of hands actively coloring an open
      page inside a coloring book with colored pencils. I have ATTACHED the exact
      image file of the INTERIOR COLORING PAGE. Render this attached line-art drawing
      printed on the page with 100% exact visual fidelity. MANDATORY REQUIREMENT:
      Render the prominent solid black rectangular border frame box enclosing the
      page artwork, exactly as shown in the attached file. Square 1:1 aspect ratio.'
    preview_4: 'Generate a clean overhead flatlay photograph displaying a 2x2 grid
      collage of 4 interior coloring book pages on a bright wooden surface with colored
      pencils. I have ATTACHED the exact 4 image files of the INTERIOR COLORING PAGES.
      Render these 4 ATTACHED black-and-white line-art drawings clearly inside the
      2x2 grid layout, one attached page per grid slot with 100% exact visual fidelity.
      MANDATORY REQUIREMENT: Render the crisp solid black rectangular border frame
      box enclosing each of the 4 page illustrations. Square 1:1 aspect ratio.'
    preview_5: 'Generate a warm aesthetic lifestyle photograph featuring a physical
      paperback coloring book on a cozy wooden desk next to green house plants, watercolor
      pencils, and soft sunlight. I have ATTACHED the exact image file of the FRONT
      COVER. Display the physical book with this ATTACHED cover image printed clearly
      on the front cover. CRITICAL REQUIREMENT: Render the attached cover image with
      100% exact visual fidelity. Do NOT generate or modify any artwork or text on
      the book cover. Keep the cover design identical to the attached image. Square
      1:1 aspect ratio.'
