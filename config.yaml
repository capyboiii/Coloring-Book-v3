    \ / VIGNETTE LAYOUT: Main character framed nicely inside a central decorative\
    \ arch, ribbon, or circular vignette with surrounding thematic elements (stars,\
    \ flowers, leaves, toys). - FULL-PAGE ACTION / PLAY SCENE: Characters engaging\
    \ in a joyful, dynamic activity with colorful props and environment details filling\
    \ the scene naturally.\nART STYLE & QUALITY: ART STYLE (HAND-COLORED COLORING\
    \ BOOK STYLE): Vibrant, charming children's coloring book cover style that looks\
    \ like a beautifully completed hand-colored illustration. - LINEWORK: Bold, clean,\
    \ crisp black outlines defining all characters and elements, matching the line-art\
    \ style inside the coloring book. - COLORING & TEXTURE: Filled with rich, cheerful,\
    \ vibrant colors having subtle colored pencil and crayon shading textures within\
    \ the black outlines, giving it a warm, delightful hand-colored look. - COLOR\
    \ PALETTE: Harmonious, bright, friendly colors (warm sun yellow, soft coral, sky\
    \ blue, mint green, cozy lavender, warm cream) filled with soft gradient shading.\
    \ - NO photorealism, NO harsh 3D glossy plastic renders, NO dark gritty shadows.\
    \ \nRULES: Render ONLY the specified book title text \"Cozy Nature Getaway Coloring\
    \ Book\". Do NOT add any extra random scrambled letters or watermarks. Vertical\
    \ portrait orientation, aspect ratio 8.5:11, maximum resolution, crisp details,\
    \ professional book publishing quality."
  back_cover_custom: 'THIS IS THE BACK COVER (REAR COVER OF THE BOOK). DO NOT WRITE
    OR DRAW ANY TITLE TEXT.

    Generate the matching BACK COVER for the children''s coloring book.

    CRITICAL RULE - NO TITLE TEXT: Unlike the front cover, this BACK COVER must have
    ABSOLUTELY ZERO WORDS, ZERO TITLE TEXT, ZERO LETTERS, and ZERO HEADINGS. Do NOT
    repeat or render the book title on this back cover image. Pure background illustration
    artwork only.

    MATCHING ART STYLE & COLOUR: MUST use EXACTLY the same art style, colour palette
    (ART STYLE (HAND-COLORED COLORING BOOK STYLE): Vibrant, charming children''s coloring
    book cover style that looks like a beautifully completed hand-colored illustration.
    - LINEWORK: Bold, clean, crisp black outlines defining all characters and elements,
    matching the line-art style inside the coloring book. - COLORING & TEXTURE: Filled
    with rich, cheerful, vibrant colors having subtle colored pencil and crayon shading
    textures within the black outlines, giving it a warm, delightful hand-colored
    look. - COLOR PALETTE: Harmonious, bright, friendly colors (warm sun yellow, soft
    coral, sky blue, mint green, cozy lavender, warm cream) filled with soft gradient
    shading. - NO photorealism, NO harsh 3D glossy plastic renders, NO dark gritty
    shadows. ), line weight, and character design as the front cover to form a seamless
    matching set.

    CREATIVE & DYNAMIC BACK COVER COMPOSITION OPTIONS: Create a complementary scene
    or composition that feels distinct from the front cover: - STORY CONTINUATION
    LAYOUT: A charming continuation scene (e.g. characters resting at sunset, waving
    goodbye, sleeping cozy under stars, or playing with secondary theme elements).
    - CORNER / BOTTOM VIGNETTE LAYOUT: A cute mini-scene featuring 1-2 secondary characters
    or objects placed in the bottom or lower corner with decorative elements framing
    the edges. - PASTEL PATTERN & FRAME LAYOUT: A subtle, whimsical background pattern
    (cloud, star, flower, or paw motifs) with a soft, clean central area.

    TEXT & BARCODE BLURB AREA: Keep the middle/upper central area visually soft, clean,
    and uncluttered so text blurb and ISBN barcode can be placed cleanly.

    RULES: ABSOLUTELY NO TEXT of any kind: NO title, NO title text, NO letters, NO
    words, NO numbers, NO logos, NO signatures, or watermarks anywhere in the image.
    Pure artwork illustration only. Vertical portrait orientation, aspect ratio 8.5:11,
    maximum resolution.'
subjects:
- A happy puppy splashing inside a bubble bath with a yellow rubber duck.
- A fluffy dog wearing a party hat next to a birthday cake with one candle.
- A cute puppy sleeping curled up inside a basket with a small teddy bear.
- A playful dog chasing a fluttering butterfly in a field of sunflowers.
- A little puppy digging in the sand at the beach next to a simple sandcastle.
