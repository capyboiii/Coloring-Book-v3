prompts:
  cover_audience: adults
  page: 'A black and white line-art coloring page illustration for {audience_desc}.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing, no outline
    along the edges of the image. The white background must extend cleanly around
    the artwork.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number, signature,
    watermark or logo.

    100% original artwork with generic subjects only. NO copyrighted or trademarked
    character designs, logos, or recognizable media franchise elements.

    Line work: pure black outlines on a pure white background, {page_line_style}

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Vertical portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp
    vector-like edges.

    '
  cover_style: Bold, vibrant cartoon coloring-book cover art with clean crisp black
    outlines, rich saturated colours and cel-shaded gradients, fun and eye-catching.
    GLOSSY finish is welcome where it suits - shiny highlights, candy-like sheen and
    a little 3D pop are allowed. Colour palette and mood chosen to fit THIS book subject.
    Professional, polished and appealing, never muddy or washed out. NO photorealism.
  cover_styles:
    glossy:
      art: 'ART STYLE - GLOSSY CARTOON: bold, vibrant cartoon coloring-book cover
        art with clean crisp black outlines, rich saturated colours and cel-shaded
        gradients. Glossy finish with shiny highlights, candy-like sheen and a little
        3D pop. Professional, polished and eye-catching, never muddy or washed out.
        NO photorealism.'
      title: bright high-contrast fill with glossy 3D shine, highlights and a crisp
        contact shadow tight against the letters.
      grain: 0.35
    watercolor:
      art: 'ART STYLE - SOFT WATERCOLOR: delicate hand-painted look. Translucent washes,
        soft colour bleeds and blooms, wet-on-wet gradients, visible watercolour paper
        texture. Light, airy and dreamy with soft edges. Fine loose ink outlines,
        not heavy. NO gloss, NO plastic sheen, NO 3D pop, NO airbrush. Real watercolour
        on paper. NO photorealism.'
      title: gentle watercolour-textured matte fill with a soft shadow.
      grain: 0.1
    flat_vector:
      art: 'ART STYLE - FLAT VECTOR: clean modern flat-design cartoon. Solid flat
        colour blocks, simple crisp shapes, minimal shading, bold uniform outlines.
        Bright and cheerful, graphic and tidy. NO texture, NO gloss, NO 3D, NO gradients
        beyond simple flat tones. NO photorealism.'
      title: flat solid-colour fill with a clean bold outline and a simple flat drop
        shadow.
      grain: 0.35
    gouache:
      art: 'ART STYLE - GOUACHE POSTER: rich opaque gouache painting. Dense flat-but-painterly
        colour, smooth matte coverage, visible brush strokes, bold poster-like shapes.
        Rich, vibrant and premium. Matte finish, NO gloss, NO plastic sheen, NO 3D
        pop. NO photorealism.'
      title: bold painted matte fill with a strong outline and a soft shadow.
      grain: 0.1
    vintage:
      art: 'ART STYLE - VINTAGE STORYBOOK: retro 1950s-60s storybook illustration.
        Nostalgic muted palette, slightly aged paper texture, screen-print / halftone
        feel, charming hand-drawn lines. Classic storybook mood. Matte, NO gloss,
        NO 3D, NO photorealism.'
      title: retro hand-lettered matte fill with a warm outline and a gentle vintage
        shadow.
      grain: 0.1
    colored_pencil:
      art: 'ART STYLE - COLORED PENCIL: detailed hand-drawn coloured-pencil illustration.
        Fine layered pencil strokes, soft realistic shading, gentle paper grain, rich
        natural colours fitting the subject. Semi-realistic but still friendly. Matte,
        NO gloss, NO plastic 3D, NO digital airbrush.'
      title: soft pencil-shaded matte fill with a hand-drawn outline and a light shadow.
      grain: 0.1
    papercut:
      art: 'ART STYLE - PAPERCUT COLLAGE: layered cut-paper collage look. Flat paper
        shapes stacked in layers with soft realistic drop shadows between layers,
        subtle paper texture, clean edges. Crafty and charming. Matte, NO gloss, NO
        airbrush. NO photorealism.'
      title: cut-paper style letters with soft layer shadows and a matte finish.
      grain: 0.1
  front_cover: 'A premium, full-colour FRONT COVER illustration for {audience_article}
    {audience_adj} coloring book.


    SUBJECT - build the cover ONLY from this, and add nothing from a different species
    or setting:

    {subject_hint}


    {char_direction}


    COMPOSITION: {cover_layout} Arrange it however looks most beautiful, as a single
    unified scene or a natural grouping of the characters, but it MUST read as ONE
    continuous illustration on one shared background - one art style, one palette,
    one light mood. No split bands, strips, panels, boxed sections or dividing lines.


    TITLE "{title}": spell it EXACTLY, letter for letter. {title_shape} {title_style}
    It stays a distinct graphic element sitting boldly in front as eye-catching cover
    typography - never painted onto a surface inside the scene, never following the
    perspective of an object. Place it anywhere that looks best (2-3 centred lines
    if long), but keep every letter at least 8% of the cover width in from all four
    edges.


    TITLE COLOUR - MUST CONTRAST WITH WHAT IS BEHIND IT: first look at the part of
    the illustration the letters will sit over, then choose letter colours that read
    strongly against it. If that area is dark, the letters are light; if it is light,
    the letters are dark. NEVER put the letters in a colour close to the background
    directly behind them - no red lettering over a red scene, no green over green,
    no white over pale snow or sky. If the background behind the title is busy or
    multi-coloured, give every letter a thick unbroken outline in a strongly contrasting
    tone so the shapes stay crisp against it.


    TITLE MUST BELONG TO THIS BOOK: the lettering''s colours, material and mood come
    from this book''s own theme and palette - it should look designed for THIS cover,
    not a generic caption dropped on top. Echo the scene''s own materials and season
    in the letterforms where it helps, but keep the words perfectly legible and do
    not let decoration eat into the shapes of the letters.


    The title sits ON TOP OF the illustration: the artwork continues behind the letters
    without interruption. Do NOT clear, flatten, empty or fade the area behind the
    title, and do NOT reserve a plain colour panel, banner or block for it - that
    region must stay as fully illustrated as everywhere else. Readability comes from
    the lettering''s own outline, fill and shadow, NOT from emptying the scene behind
    it. Keep every letter fully legible, with no object drawn over the front of the
    letterforms.


    COMPLETE FULL-BLEED ARTWORK WITH CLEAN COMPOSITION: the illustration must fill
    the ENTIRE cover edge-to-edge, corner to corner, as a rich, fully realized environment
    (room, wall, floor, sky, or natural scenery). However, maintain clear VISUAL HIERARCHY
    and natural breathing room - do NOT overcrowd or clutter the scene with excessive
    tiny objects. Use clean, restful space (such as a smooth wall, sky, flooring or
    gentle environmental textures) to give the composition balance and let the main
    subject stand out clearly.


    DEPTH OF FIELD & LIGHTING HIERARCHY: establish a strong, unambiguous focal point.
    The primary subject should be the sharpest, most vibrant, and visually dominant
    element. The background environment should feature natural atmospheric depth and
    softer contrast so it naturally supports the main subject without competing for
    attention. Use expressive natural lighting and a harmonious color palette chosen
    specifically to fit THIS book''s subject and mood (such as cool moonlit hues for
    night or spooky themes, crisp vibrant sunlight for daytime nature, or warm tones
    only when the setting specifically calls for it) to guide the viewer''s eye smoothly
    to the focal character.


    STRICTLY FORBIDDEN: NO border or frame around the image, NO unpainted blank white
    margins, NO sticker cutout look where the subject floats isolated on a plain solid
    colour sheet, NO washed-out overexposed bleached patches, NO artificial blank
    text banners or placeholder blocks.


    Only the characters'' faces stay comfortably in from the edges.


    {cover_detail}


    ART STYLE: {style}


    Draw ONLY the illustration and the title - 100% original artwork with generic
    characters only, no copyrighted or trademarked franchise designs. No border or
    frame, no guide/crop marks, no barcode, ISBN, price, logo, author name, watermark,
    or any words other than "{title}".


    Vertical portrait orientation, aspect ratio 8.625:11.25, maximum resolution.'
  nudge: 'Generate the image now. Output only the image itself, with no explanation
    and no text in your reply. '
  back_cover: 'THIS IS THE BACK COVER (REAR COVER OF THE BOOK).


    Generate the matching BACK COVER for the {audience_adj} coloring book.


    CRITICAL RULE - ABSOLUTELY NO TEXT: this BACK COVER must contain ZERO words, ZERO

    letters, ZERO numbers and ZERO headings. Do NOT repeat the book title. Do NOT
    draw a

    barcode, an ISBN, a price box, a publisher logo, an author name, a watermark,
    a label

    or any annotation. 100% original artwork only, no copyrighted or trademarked characters,
    nothing else.


    MATCHING ART STYLE & COLOUR: MUST use EXACTLY the same art style, colour palette

    ({style}), line weight, and character design as the front cover to form a seamless

    matching set.


    CAST RULE - STRICT: every character and creature must belong to the subject of
    this

    book, exactly the same cast as the front cover. Do NOT add a fox, a rabbit, a
    bear, a

    squirrel, a deer, an owl or any other generic storybook animal unless it is genuinely

    part of this book''s subject. Do NOT default to a green forest, a woodland clearing
    or a

    flower meadow unless that is truly this book''s setting.


    COMPLETE FULL-BLEED ARTWORK WITH BALANCED COMPOSITION: The illustration must fill
    the ENTIRE canvas edge-to-edge, corner to corner, as a fully rendered scene. Maintain
    comfortable breathing room and clear visual balance - do NOT overcrowd the image
    with clutter or excessive objects. Allow calm background areas (such as sky, landscape,
    flooring or wall) to give the scene harmony.


    DEPTH & LIGHTING: Create natural atmospheric depth and pleasant lighting that
    complements the front cover. The primary elements should be sharp and clear, while
    background scenery has gentle depth and softer contrast to create dimension.


    STRICTLY FORBIDDEN: NO white borders or blank margins, NO unpainted blank paper
    patches, NO guide lines, crop marks, or dividing boxes, NO sticker cut-out look
    where objects float isolated on a plain solid backdrop.


    COMPOSITION: Create a complementary scene that feels distinct from the front cover
    - a

    charming continuation of the story. Good options: the characters engaged in an
    activity that complements the theme, exploring their environment, waving goodbye,
    or interacting with secondary elements.

    Spread interest evenly across the whole image rather than concentrating everything
    in

    one spot. Keep the busiest detail and the characters'' faces away from the very
    corners,

    and let calmer background scenery sit in the corner areas instead.


    Vertical portrait orientation, aspect ratio 8.625:11.25, maximum resolution.'
  previews:
    preview_1: 'Create a flat, FRONT-FACING product image of a paperback coloring
      book cover, shown perfectly straight-on.


      VIEWPOINT - THE MOST IMPORTANT RULE: The cover is a flat upright rectangle facing
      the camera DIRECTLY, exactly parallel to the image plane, with zero perspective.
      This is a head-on / flat-lay view seen straight from the front. All four corners
      are perfect 90-degree square corners. The two vertical edges are exactly vertical
      and parallel; the two horizontal edges are exactly horizontal and parallel.
      ABSOLUTELY NO angle, NO tilt, NO rotation, NO 3D turn, NO foreshortening, NO
      perspective vanishing. Do NOT show the spine, the side, the thickness or the
      stacked page edges - we see ONLY the flat front face, like a flat scan of the
      cover.


      DEPTH: Add ONLY a soft, even drop shadow directly behind the rectangle to hint
      it is a real book, plus optionally a very thin sliver of white page edge along
      the bottom. Nothing else that implies a 3D angle.


      FRAMING: The cover rectangle is centred and occupies about 85 percent of the
      frame, on a pure white seamless background with clean white margin on all four
      sides.


      THE COVER ARTWORK: I have ATTACHED the front cover image. Reproduce that attached
      artwork on the cover FLAT and UNDISTORTED, filling the whole cover exactly as
      in the attached file. Keep the same illustration, characters, colours and title
      wording. Do NOT add, remove, reword or redraw any text, and do NOT invent extra
      illustrations, logos or watermarks. Do NOT rotate, tilt, skew, curve, warp or
      foreshorten the artwork in any way.


      Clean minimalist white-background product shot, sharp focus, high resolution.
      Square 1:1 aspect ratio.'
    preview_2: 'Generate a realistic photograph of an open paperback coloring book
      laying flat on a warm wooden table next to colored pencils and a cup of tea.
      I have ATTACHED the exact image files of the INTERIOR COLORING PAGES. Render
      these attached black-and-white line-art pages printed clearly on the open left
      and right pages of the book with 100% exact visual fidelity. MANDATORY REQUIREMENT:
      Each printed page illustration MUST include the crisp, solid black rectangular
      border frame box enclosing the artwork, exactly as shown in the attached files.
      Square 1:1 aspect ratio.'
    preview_3: 'Generate a close-up photograph of hands actively coloring an open
      page inside a coloring book with colored pencils. I have ATTACHED the exact
      image file of the INTERIOR COLORING PAGE. Render this attached line-art drawing
      printed on the page with 100% exact visual fidelity. MANDATORY REQUIREMENT:
      Render the prominent solid black rectangular border frame box enclosing the
      page artwork, exactly as shown in the attached file. Square 1:1 aspect ratio.'
    preview_4: 'Generate a clean overhead flatlay photograph displaying a 2x2 grid
      collage of 4 interior coloring book pages on a bright wooden surface with colored
      pencils. I have ATTACHED the exact 4 image files of the INTERIOR COLORING PAGES.
      Render these 4 ATTACHED black-and-white line-art drawings clearly inside the
      2x2 grid layout, one attached page per grid slot with 100% exact visual fidelity.
      MANDATORY REQUIREMENT: Render the crisp solid black rectangular border frame
      box enclosing each of the 4 page illustrations. Square 1:1 aspect ratio.'
    preview_5: 'Generate a warm aesthetic lifestyle photograph featuring a physical
      paperback coloring book on a cozy wooden desk next to green house plants, watercolor
      pencils, and soft sunlight. I have ATTACHED the exact image file of the FRONT
      COVER. Display the physical book with this ATTACHED cover image printed clearly
      on the front cover. CRITICAL REQUIREMENT: Render the attached cover image with
      100% exact visual fidelity. Do NOT generate or modify any artwork or text on
      the book cover. Keep the cover design identical to the attached image. Square
      1:1 aspect ratio.'
subjects:
- A fluffy owl wearing a tiny knitted scarf perches on a snowy pine branch beside
  two large pine cones.
- A young spotted deer gently nudges a wrapped Christmas present sitting in a drift
  of fresh snow.
- A baby fawn curls up asleep under an evergreen bough decorated with hanging wooden
  star ornaments.
- A round little owl watches from a tree hollow as large snowflakes gently fall around
  a standing deer.
