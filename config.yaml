prompts:
  page: 'A black and white line-art coloring page illustration for children ages 4-8.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing, no outline
    along the edges of the image. The white background must extend cleanly around
    the artwork.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number, signature,
    watermark or logo.

    Line work: pure black outlines on a pure white background, uniform thick strokes,
    closed shapes with large open areas that are easy to colour in.

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Vertical portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp
    vector-like edges.

    '
  cover_style: 'ART STYLE (HAND-COLORED COLORING BOOK STYLE): Vibrant, charming children''s
    coloring book cover style that looks like a beautifully completed hand-colored
    illustration. - LINEWORK: Bold, clean, crisp black outlines defining all characters
    and elements, matching the line-art style inside the coloring book. - COLORING
    & TEXTURE: Filled with rich, cheerful, vibrant colors having subtle colored pencil
    and crayon shading textures within the black outlines, giving it a warm, delightful
    hand-colored look. - COLOR PALETTE: Harmonious, bright, friendly colors (warm
    sun yellow, soft coral, sky blue, mint green, cozy lavender, warm cream) filled
    with soft gradient shading. - NO photorealism, NO harsh 3D glossy plastic renders,
    NO dark gritty shadows. '
  front_cover: 'A vibrant, full-colour FRONT COVER illustration for a children''s
    coloring book.


    THIS BOOK''S SUBJECT - build the cover only from this:

    {subject_hint}

    Every character, creature and object must belong to that subject. Do NOT add a
    fox, a

    rabbit, a bear, a squirrel, a deer or an owl unless it genuinely belongs. If one
    character

    cannot fill the cover, show MORE OF THE SAME subject in different poses and sizes,
    never a

    different species. Do NOT fall back on a generic green forest or flower meadow
    unless the

    scenes above are actually set there.


    LAYOUT: {cover_layout}


    ONE UNBROKEN PICTURE - THIS IS THE MOST IMPORTANT RULE. The cover is a single
    scene in a

    single view, drawn at full strength from the top edge to the bottom edge and from
    side to

    side. There is NO band, stripe, gap, seam, empty strip or white area anywhere,
    and the

    cover is NEVER split into an upper scene and a lower scene. Behind the title the
    scenery

    keeps exactly the same colours, brightness and density of detail as everywhere
    else: if

    the letters were hidden, that area would look like a completely ordinary part
    of the

    picture.


    TITLE "{title}" - spell it EXACTLY, letter for letter. Draw it as a real object
    living

    inside this scene, not as text laid on top: the same bold black hand-drawn outline,
    the

    same coloured-pencil shading and the same palette as the artwork; leaves, vines,
    flowers

    or small motifs weaving behind some letters and in front of others; scenery passing
    behind

    them. Place the title in the upper part of the cover, with a clear band of illustration

    ABOVE it at least as tall as one line of the lettering, so artwork is always the
    first

    thing at the top. Never let a letter touch or come near any edge. If the title
    is long,

    break it into two or three shorter centred lines.


    KEEP IT READABLE THE RIGHT WAY: give the letters a thick dark outline and strong
    solid

    colour so they stand out against a fully detailed background, the way hand-painted

    lettering reads on a mural. NEVER whiten, fade, blur, lighten, empty or simplify
    anything

    behind or around the words, in ANY shape - no white patch, no cloud, no oval,
    no halo, no

    glow, no mist, no panel, no banner, no box, no drop shadow.


    Main characters and their faces stay well inside the picture; background detail
    runs out to

    all four edges with no white frame and no empty margin.


    ART STYLE: {style}


    Draw ONLY the illustration and the title. No guide lines, no dashed lines, no
    crop marks,

    no rulers, no labels, no captions, no annotations, no barcode, no ISBN, no price,
    no logo,

    no author name, no watermark, and no words of any kind other than "{title}".


    Vertical portrait orientation, aspect ratio 8.625:11.25, maximum resolution.'
  nudge: 'Generate the image now. Output only the image itself, with no explanation
    and no text in your reply. '
  back_cover: 'THIS IS THE BACK COVER (REAR COVER OF THE BOOK).


    Generate the matching BACK COVER for the children''s coloring book.


    CRITICAL RULE - ABSOLUTELY NO TEXT: this BACK COVER must contain ZERO words, ZERO

    letters, ZERO numbers and ZERO headings. Do NOT repeat the book title. Do NOT
    draw a

    barcode, an ISBN, a price box, a publisher logo, an author name, a watermark,
    a label

    or any annotation. Pure illustration artwork only, nothing else.


    MATCHING ART STYLE & COLOUR: MUST use EXACTLY the same art style, colour palette

    ({style}), line weight, and character design as the front cover to form a seamless

    matching set.


    CAST RULE - STRICT: every character and creature must belong to the subject of
    this

    book, exactly the same cast as the front cover. Do NOT add a fox, a rabbit, a
    bear, a

    squirrel, a deer, an owl or any other generic storybook animal unless it is genuinely

    part of this book''s subject. Do NOT default to a green forest, a woodland clearing
    or a

    flower meadow unless that is truly this book''s setting.


    COMPLETE EDGE-TO-EDGE ARTWORK - THIS IS THE MOST IMPORTANT RULE: The illustration
    must

    fill the ENTIRE canvas completely, corner to corner, with an even level of finish

    everywhere. Every square inch must be fully drawn and fully coloured.


    STRICTLY FORBIDDEN - do NOT produce any of the following: NO white glow, NO bright

    haze, NO blank white patch, NO empty unpainted area, NO washed-out region, NO
    faded or

    blurred zone, NO soft spotlight, NO vignette, NO radial gradient burst, NO reserved

    blank space of any kind, NO guide lines, NO dashed lines, NO crop marks, NO coloured

    bands or strips along any edge, NO rectangles outlining regions of the page. There
    must

    be NO area that looks unfinished, overexposed, or deliberately left empty. If
    a region

    has few objects, it must still be fully illustrated with background detail such
    as

    wallpaper pattern, sky, foliage or floor, drawn and coloured at the same quality
    as the

    rest.


    COMPOSITION: Create a complementary scene that feels distinct from the front cover
    - a

    charming continuation of the story. Good options: the characters resting at sunset,

    waving goodbye, sleeping cosily under stars, or playing with secondary theme elements.

    Spread interest evenly across the whole image rather than concentrating everything
    in

    one spot. Keep the busiest detail and the characters'' faces away from the very
    corners,

    and let calmer background scenery sit in the corner areas instead.


    Vertical portrait orientation, aspect ratio 8.625:11.25, maximum resolution.'
  previews:
    preview_1: 'Generate a professional ecommerce product mockup photograph of a physical
      paperback

      coloring book, photographed as a real object.


      THE BOOK AS AN OBJECT - this is the point of the image: Show a real paperback
      book

      standing upright on a pure white seamless background. Photograph it front-facing
      but

      turned slightly, roughly 15 degrees, so that the thickness of the book and the
      stacked

      page edges are clearly visible along one side. Add a soft realistic contact
      shadow on

      the ground beneath the book. Soft even studio lighting, gentle highlight on
      the glossy

      cover stock.


      FRAMING - equally important: The book must occupy only about 65 percent of the
      frame,

      centred, with generous clean white empty space on all four sides. Do NOT let
      the cover

      artwork bleed to the edges of the image. The final image is a photo OF a book
      sitting

      in white space, not a flat picture of a cover.


      THE COVER ARTWORK: I have ATTACHED the front cover image. Print that attached
      artwork

      onto the front cover of the book in the photograph. Keep the same illustration,
      the

      same characters, the same colours and the same title wording. Do NOT add, remove,

      reword or redraw any text, and do NOT invent extra illustrations, logos or watermarks.


      PERSPECTIVE IS EXPECTED: Because the book is a solid object seen at an angle,
      the cover

      artwork MUST be foreshortened, slightly tilted and wrapped over the book''s
      thickness.

      This perspective distortion is correct and wanted. Do NOT output the attached
      image

      flat, unrotated or filling the whole canvas - that is a failed result.


      Clean minimalist white-background product shot, sharp focus, high resolution.'
    preview_2: 'Generate a realistic photograph of an open paperback coloring book
      laying flat on a warm wooden table next to colored pencils and a cup of tea.
      I have ATTACHED the exact image files of the INTERIOR COLORING PAGES. Render
      these attached black-and-white line-art pages printed clearly on the open left
      and right pages of the book with 100% exact visual fidelity. MANDATORY REQUIREMENT:
      Each printed page illustration MUST include the crisp, solid black rectangular
      border frame box enclosing the artwork, exactly as shown in the attached files.'
    preview_3: 'Generate a close-up photograph of hands actively coloring an open
      page inside a coloring book with colored pencils. I have ATTACHED the exact
      image file of the INTERIOR COLORING PAGE. Render this attached line-art drawing
      printed on the page with 100% exact visual fidelity. MANDATORY REQUIREMENT:
      Render the prominent solid black rectangular border frame box enclosing the
      page artwork, exactly as shown in the attached file.'
    preview_4: 'Generate a clean overhead flatlay photograph displaying a 2x2 grid
      collage of 4 interior coloring book pages on a bright wooden surface with colored
      pencils. I have ATTACHED the exact 4 image files of the INTERIOR COLORING PAGES.
      Render these 4 ATTACHED black-and-white line-art drawings clearly inside the
      2x2 grid layout, one attached page per grid slot with 100% exact visual fidelity.
      MANDATORY REQUIREMENT: Render the crisp solid black rectangular border frame
      box enclosing each of the 4 page illustrations.'
    preview_5: 'Generate a warm aesthetic lifestyle photograph featuring a physical
      paperback coloring book on a cozy wooden desk next to green house plants, watercolor
      pencils, and soft sunlight. I have ATTACHED the exact image file of the FRONT
      COVER. Display the physical book with this ATTACHED cover image printed clearly
      on the front cover. CRITICAL REQUIREMENT: Render the attached cover image with
      100% exact visual fidelity. Do NOT generate or modify any artwork or text on
      the book cover. Keep the cover design identical to the attached image.'
