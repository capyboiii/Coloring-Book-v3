book:
  title: Unicorn Coloring Book – Sparkly & Magical Creatures to Color
  subtitle: ''
  author: ''
  num_images: 5
  blank_verso: true
  front_matter_pages: 0
print:
  trim_width: 8.5
  trim_height: 11
  bleed: 0.125
  safety_margin: 0.5
  gutter: 0.375
  dpi: 300
  paper_thickness: 0.002252
  binding: perfect
  min_pages: 32
  cover_wrap: 0.25
  spine_width: 0.0
  full_bleed_interior: false
  interior_border: true
process:
  pure_bw: false
prompts:
  page: 'A black and white line-art coloring page illustration for children ages 4-8.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing,

    no outline along the edges of the image, no decorative margin, no rounded

    corners, no torn-paper or sketchbook edge, no drop shadow, no vignette.

    The white background must extend cleanly all the way to every edge of the

    image, with nothing drawn at the edges.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number,

    signature, watermark or logo.

    Line work: pure black outlines on a pure white background, uniform thick

    strokes, closed shapes with large open areas that are easy to colour in.

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Composition: one single centred illustration, drawn as isolated artwork on

    plain white, with a small even area of empty white space around it. Vertical

    portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp

    vector-like edges.

    '
  cover_style: 'Art style: cheerful children''s picture-book illustration, soft rounded

    cartoon shapes, bold clean outlines, flat colours with gentle soft shading.

    NO photorealism, NO 3D render, NO glossy plastic look, NO harsh contrast.

    Colour palette: use ONLY these colours and their light/dark variations -

    leaf green #7FB77E, warm cream #F1F0C0, sky blue #A8DADC,

    soft coral #F4A896, warm brown #8D6E63, off-white #FFFDF5.

    Lighting: flat, even, warm daylight. Same line weight and same rendering

    quality across the whole image.

    '
  front_cover: 'A vibrant full-colour FRONT COVER illustration for a children''s coloring

    book. Theme: {title}. One friendly hero character from the theme, placed in

    the lower two thirds, with a simple whimsical background.

    Keep the upper third visually calm and mostly empty so a title can be

    placed there later.

    {style}

    NO text, letters, numbers, logo or watermark anywhere in the image.

    Vertical portrait orientation, aspect ratio 8.5:11, maximum resolution.

    '
  nudge: 'Generate the image now. Output only the image itself, with no explanation

    and no text in your reply.

    '
  back_cover: 'Generate an image. Do NOT reply with words, do NOT describe what you
    will

    draw - output the picture itself.

    Create the matching BACK COVER for the same book, using EXACTLY the

    same colour palette, art style, line weight and character design as the

    front cover you just made. It must look like the same book.

    Theme: {title}. A simple background: a few small decorative elements from

    the theme (leaves, stars, paw prints) scattered around the EDGES only.

    The CENTRE must stay clean, calm and uncluttered so a text blurb can be

    placed there later.

    {style}

    NO text, letters, numbers, logo or watermark anywhere in the image.

    Vertical portrait orientation, aspect ratio 8.5:11, maximum resolution.

    '
  previews:
    preview_1: 'Generate a professional 3D product mockup photograph of a paperback
      coloring book standing isolated on a solid white background with a soft drop
      shadow. The attached image is the exact FRONT COVER. Printed on the front cover
      of the book mockup, render the attached image with 100% exact visual fidelity.
      ABSOLUTE RULE: DO NOT add, modify, or remove any text, title, words, letters,
      logos, or drawings. The front cover must be an exact 1:1 replica of the attached
      image without any extra added text, words, or illustrations. High resolution
      ecommerce product shot.'
    preview_2: 'Generate a realistic photograph of an open paperback coloring book
      laying flat on a warm wooden table next to colored pencils and a cup of tea.
      The attached images are the exact INTERIOR COLORING PAGES. Render these attached
      line-art pages printed on the open left and right pages of the book with 100%
      exact visual fidelity. ABSOLUTE RULE: DO NOT add, modify, or remove any text,
      titles, captions, words, or drawings on the open pages. The pages inside the
      book must showcase the exact attached black-and-white line-art drawings without
      any added text or modified artwork.'
    preview_3: 'Generate a close-up photograph of hands actively coloring an open
      page inside a coloring book with colored pencils. The attached image is the
      exact INTERIOR COLORING PAGE. Render this attached line-art drawing printed
      on the page with 100% exact visual fidelity. ABSOLUTE RULE: DO NOT add, modify,
      or remove any text, titles, words, or drawings on the page. Do not generate
      any new text or extra illustrations. Only realistic colored pencil shading applied
      within the existing attached line art.'
    preview_4: 'Generate a clean overhead flatlay photograph displaying 4 interior
      coloring pages arranged in a 2x2 grid collage on a bright wooden surface with
      colored pencils. The attached images are the exact INTERIOR COLORING PAGES.
      Render all 4 attached line-art pages with 100% exact visual fidelity. ABSOLUTE
      RULE: DO NOT add, modify, or remove any text, titles, words, numbers, or artwork
      on any of the 4 pages. Keep all line-art drawings and text 100% identical to
      the attached images without adding any new text or extra drawings.'
    preview_5: 'Generate a warm aesthetic lifestyle photograph of a paperback coloring
      book on a cozy desk next to house plants, watercolor set, and soft morning sunlight.
      The attached image is the exact FRONT COVER. Display the physical book showing
      this exact cover image printed with 100% exact visual fidelity. ABSOLUTE RULE:
      DO NOT add, modify, or remove any text, titles, words, letters, logos, or drawings
      on the book cover. Keep all graphics and text 100% identical to the attached
      image without adding any new text or extra artwork.'
subjects:
- A happy unicorn wearing a birthday hat eats a slice of cake.
- A cheerful unicorn jumps high over a big colorful rainbow.
- A sleepy unicorn rests on a soft fluffy cloud surrounded by stars.
- A friendly unicorn plays tag with two fluttering butterflies in a field.
- A cute unicorn wears a shiny crown while sitting near a enchanted castle.
cover_text:
  back_blurb: '

    '
backend: web
api:
  key_env: GEMINI_API_KEY
  image_model: gemini-2.5-flash-image
  text_model: gemini-2.5-flash
  timeout: 180
  delay_between_prompts:
  - 2
  - 5
browser:
  headless: false
  gemini_url: https://gemini.google.com/app
  generation_timeout: 240
  recycle_tab_every: 5
  stall_timeout: 120
  max_requeue: 2
  delay_between_prompts:
  - 3
  - 7
  typing_delay_ms: 1
  max_retries: 3
  model_hint: ''
  profiles:
  - ./.chrome-account1
  - ./.chrome-account2
  concurrency_per_profile: 2
paths:
  raw_dir: output/01_raw
  processed_dir: output/02_processed
  pdf_dir: output/03_pdf
  state_file: output/state.json
_book: unicorn-coloring-book-sparkly-magical-creatures-to-color
