  trim_width: 8.5
  trim_height: 11
  bleed: 0.125
  safety_margin: 0.6
  gutter: 0.375
  dpi: 300
  paper_thickness: 0.00337
  binding: perfect
  min_pages: 32
  cover_wrap: 0.25
  pod_package_id: 0850X1100BWSTDPB060UW444MXX
  spine_width: 0.182
  full_bleed_interior: false
  interior_border: true
  interior_border_width: 1.5
  preview_remove_watermark: true
  preview_watermark_center:
  - 0.881
  - 0.882
  preview_watermark_size:
