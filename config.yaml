book:
  title: cute cat
  subtitle: ''
  author: ''
  num_images: 10
  blank_verso: true
  front_matter_pages: 0
print:
  trim_width: 8.5
  trim_height: 11
  bleed: 0.125
  safety_margin: 0.5
  gutter: 0.375
  dpi: 300
  paper_thickness: 0.002252
  binding: perfect
  min_pages: 32
  cover_wrap: 0.25
  spine_width: 0.0
  full_bleed_interior: false
  interior_border: true
  interior_border_width: 1.5
process:
  pure_bw: false
prompts:
  page: 'A black and white line-art coloring page illustration for children ages 4-8.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing, no outline
    along the edges of the image. The white background must extend cleanly around
    the artwork.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number, signature,
    watermark or logo.

    Line work: pure black outlines on a pure white background, uniform thick strokes,
    closed shapes with large open areas that are easy to colour in.

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Vertical portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp
    vector-like edges.

    '
  cover_style: 'ART STYLE (HAND-COLORED COLORING BOOK STYLE): Vibrant, charming children''s
    coloring book cover style that looks like a beautifully completed hand-colored
    illustration. - LINEWORK: Bold, clean, crisp black outlines defining all characters
    and elements, matching the line-art style inside the coloring book. - COLORING
    & TEXTURE: Filled with rich, cheerful, vibrant colors having subtle colored pencil
    and crayon shading textures within the black outlines, giving it a warm, delightful
    hand-colored look. - COLOR PALETTE: Harmonious, bright, friendly colors (warm
    sun yellow, soft coral, sky blue, mint green, cozy lavender, warm cream) filled
    with soft gradient shading. - NO photorealism, NO harsh 3D glossy plastic renders,
    NO dark gritty shadows. '
  front_cover: 'A vibrant, eye-catching, high-quality full-colour FRONT COVER illustration
    for a children''s coloring book.

    BOOK TITLE TEXT: Prominently render and display the book title text "{title}"
    in large, beautiful, colorful, readable typography at the top of the cover, perfectly
    integrated into the illustration artwork style.

    COMPOSITION & LAYOUT (CREATIVE & DYNAMIC): Create an engaging, beautifully balanced
    composition suited to the theme. You may choose one of the following dynamic compositions:
    - SCENIC STORYBOOK LAYOUT: 1-3 adorable main characters interacting playfully
    in a rich, detailed environment (such as a cozy room, magical meadow, underwater
    world, or fantasy landscape) with distinct foreground, midground, and background
    depth. - EMBLEM / VIGNETTE LAYOUT: Main character framed nicely inside a central
    decorative arch, ribbon, or circular vignette with surrounding thematic elements
    (stars, flowers, leaves, toys). - FULL-PAGE ACTION / PLAY SCENE: Characters engaging
    in a joyful, dynamic activity with colorful props and environment details filling
    the scene naturally.

    ART STYLE & QUALITY: {style}

    RULES: Render ONLY the specified book title text "{title}". Do NOT add any extra
    random scrambled letters or watermarks. Vertical portrait orientation, aspect
    ratio 8.5:11, maximum resolution, crisp details, professional book publishing
    quality. '
  nudge: 'Generate the image now. Output only the image itself, with no explanation
    and no text in your reply. '
  back_cover: 'THIS IS THE BACK COVER (REAR COVER OF THE BOOK). DO NOT WRITE OR DRAW
    ANY TITLE TEXT.

    Generate the matching BACK COVER for the children''s coloring book.

    CRITICAL RULE - NO TITLE TEXT: Unlike the front cover, this BACK COVER must have
    ABSOLUTELY ZERO WORDS, ZERO TITLE TEXT, ZERO LETTERS, and ZERO HEADINGS. Do NOT
    repeat or render the book title on this back cover image. Pure background illustration
    artwork only.

    MATCHING ART STYLE & COLOUR: MUST use EXACTLY the same art style, colour palette
    ({style}), line weight, and character design as the front cover to form a seamless
    matching set.

    CREATIVE & DYNAMIC BACK COVER COMPOSITION OPTIONS: Create a complementary scene
    or composition that feels distinct from the front cover: - STORY CONTINUATION
    LAYOUT: A charming continuation scene (e.g. characters resting at sunset, waving
    goodbye, sleeping cozy under stars, or playing with secondary theme elements).
    - CORNER / BOTTOM VIGNETTE LAYOUT: A cute mini-scene featuring 1-2 secondary characters
    or objects placed in the bottom or lower corner with decorative elements framing
    the edges. - PASTEL PATTERN & FRAME LAYOUT: A subtle, whimsical background pattern
    (cloud, star, flower, or paw motifs) with a soft, clean central area.

    TEXT & BARCODE BLURB AREA: Keep the middle/upper central area visually soft, clean,
    and uncluttered so text blurb and ISBN barcode can be placed cleanly.

    RULES: ABSOLUTELY NO TEXT of any kind: NO title, NO title text, NO letters, NO
    words, NO numbers, NO logos, NO signatures, or watermarks anywhere in the image.
    Pure artwork illustration only. Vertical portrait orientation, aspect ratio 8.5:11,
    maximum resolution. '
  previews:
    preview_1: 'Generate a high-resolution professional 3D product mockup photograph
      of a paperback coloring book standing on a solid white background with a realistic
      soft shadow. I have ATTACHED the exact image file of the FRONT COVER. Render
      this ATTACHED cover image directly and accurately onto the front cover of the
      3D paperback book mockup. CRITICAL REQUIREMENT: Do NOT invent or generate any
      new illustrations or new text. Reproduce the attached front cover image with
      100% exact visual fidelity. Clean minimalist ecommerce product mockup.'
    preview_2: 'Generate a realistic photograph of an open paperback coloring book
      laying flat on a warm wooden table next to colored pencils and a cup of tea.
      I have ATTACHED the exact image files of the INTERIOR COLORING PAGES. Render
      these attached black-and-white line-art pages printed clearly on the open left
      and right pages of the book with 100% exact visual fidelity. CRITICAL REQUIREMENT:
      Do NOT add, modify, or remove any text, titles, captions, or drawings on the
      open pages. Showcase the exact attached black-and-white line-art drawings.'
    preview_3: 'Generate a close-up photograph of hands actively coloring an open
      page inside a coloring book with colored pencils. I have ATTACHED the exact
      image file of the INTERIOR COLORING PAGE. Render this attached line-art drawing
      printed on the page with 100% exact visual fidelity. CRITICAL REQUIREMENT: Do
      NOT add, modify, or remove any text, titles, words, or drawings on the page.
      Only realistic colored pencil shading applied within the existing attached line
      art.'
    preview_4: 'Generate a clean overhead flatlay photograph displaying a 2x2 grid
      collage of 4 interior coloring book pages on a bright wooden surface with colored
      pencils. I have ATTACHED the exact 4 image files of the INTERIOR COLORING PAGES.
      Render these 4 ATTACHED black-and-white line-art drawings clearly inside the
      2x2 grid layout, one attached page per grid slot. CRITICAL REQUIREMENT: Render
      the 4 attached interior line-art images with 100% exact visual fidelity. Do
      NOT generate or invent any new drawings or extra text. Maintain the exact line-art
      artwork from the 4 attached images.'
    preview_5: 'Generate a warm aesthetic lifestyle photograph featuring a physical
      paperback coloring book on a cozy wooden desk next to green house plants, watercolor
      pencils, and soft sunlight. I have ATTACHED the exact image file of the FRONT
      COVER. Display the physical book with this ATTACHED cover image printed clearly
      on the front cover. CRITICAL REQUIREMENT: Render the attached cover image with
      100% exact visual fidelity. Do NOT generate or modify any artwork or text on
      the book cover. Keep the cover design identical to the attached image.'
subjects: []
cover_text:
  back_blurb: '

    '
backend: web
api:
  key_env: GEMINI_API_KEY
  image_model: gemini-2.5-flash-image
  text_model: gemini-2.5-flash
  timeout: 180
  delay_between_prompts:
  - 2
  - 5
browser:
  headless: false
  gemini_url: https://gemini.google.com/app
  generation_timeout: 240
  recycle_tab_every: 5
  stall_timeout: 120
  max_requeue: 2
  delay_between_prompts:
  - 3
  - 7
  typing_delay_ms: 1
  max_retries: 3
  model_hint: ''
  profiles:
  - ./.chrome-account1
  - ./.chrome-account2
  concurrency_per_profile: 2
paths:
  raw_dir: output/01_raw
  processed_dir: output/02_processed
  pdf_dir: output/03_pdf
  state_file: output/state.json
_book: cute-cat
