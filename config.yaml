book:
  title: Tree of Life Mandala Coloring Book – Inspirational Nature Designs to Calm
    Your Mind
  subtitle: ''
  author: ''
  num_images: 10
  blank_verso: true
  front_matter_pages: 0
print:
  trim_width: 8.5
  trim_height: 8.5
  bleed: 0.125
  safety_margin: 0.5
  gutter: 0.375
  dpi: 300
  paper_thickness: 0.002252
  binding: perfect
  min_pages: 32
  cover_wrap: 0.25
  spine_width: 0.0
  full_bleed_interior: false
  interior_border: true
process:
  pure_bw: false
prompts:
  page: 'A black and white line-art coloring page illustration for children ages 4-8.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing,

    no outline along the edges of the image, no decorative margin, no rounded

    corners, no torn-paper or sketchbook edge, no drop shadow, no vignette.

    The white background must extend cleanly all the way to every edge of the

    image, with nothing drawn at the edges.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number,

    signature, watermark or logo.

    Line work: pure black outlines on a pure white background, uniform thick

    strokes, closed shapes with large open areas that are easy to colour in.

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Composition: one single centred illustration, drawn as isolated artwork on

    plain white, with a small even area of empty white space around it. Vertical

    portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp

    vector-like edges.

    '
  cover_style: 'Art style: cheerful children''s picture-book illustration, soft rounded

    cartoon shapes, bold clean outlines, flat colours with gentle soft shading.

    NO photorealism, NO 3D render, NO glossy plastic look, NO harsh contrast.

    Colour palette: use ONLY these colours and their light/dark variations -

    leaf green #7FB77E, warm cream #F1F0C0, sky blue #A8DADC,

    soft coral #F4A896, warm brown #8D6E63, off-white #FFFDF5.

    Lighting: flat, even, warm daylight. Same line weight and same rendering

    quality across the whole image.

    '
  front_cover: 'A vibrant full-colour FRONT COVER illustration for a children''s coloring

    book. Theme: {title}. One friendly hero character from the theme, placed in

    the lower two thirds, with a simple whimsical background.

    Keep the upper third visually calm and mostly empty so a title can be

    placed there later.

    {style}

    NO text, letters, numbers, logo or watermark anywhere in the image.

    Vertical portrait orientation, aspect ratio 8.5:11, maximum resolution.

    '
  nudge: 'Generate the image now. Output only the image itself, with no explanation

    and no text in your reply.

    '
  back_cover: 'Generate an image. Do NOT reply with words, do NOT describe what you
    will

    draw - output the picture itself.

    Create the matching BACK COVER for the same book, using EXACTLY the

    same colour palette, art style, line weight and character design as the

    front cover you just made. It must look like the same book.

    Theme: {title}. A simple background: a few small decorative elements from

    the theme (leaves, stars, paw prints) scattered around the EDGES only.

    The CENTRE must stay clean, calm and uncluttered so a text blurb can be

    placed there later.

    {style}

    NO text, letters, numbers, logo or watermark anywhere in the image.

    Vertical portrait orientation, aspect ratio 8.5:11, maximum resolution.

    '
  previews:
    preview_1: Generate a professional 3D product mockup photograph of the paperback
      coloring book titled '{title}'. The attached image is the OUTSIDE FRONT COVER
      of the book. Render this exact image printed cleanly on the front cover of a
      paperback book, isolated and centered on a solid pure white background with
      a subtle realistic drop shadow, clean minimalist ecommerce product shot, high
      resolution.
    preview_2: Generate a realistic photograph of an open paperback coloring book
      titled '{title}' laying flat on a wooden table. The attached images are INTERIOR
      COLORING PAGES. Render these black-and-white line art pages printed clearly
      INSIDE the open pages of the book, next to colored pencils and a warm cup of
      tea.
    preview_3: Generate a close-up photograph of hands actively coloring an INTERIOR
      PAGE INSIDE an open coloring book titled '{title}'. The attached image is the
      black-and-white line art page printed on the open book page being colored with
      vibrant colored pencils.
    preview_4: Generate a clean flatlay collage photograph showing 4 INTERIOR COLORING
      PAGES from the book '{title}'. Render these 4 attached black-and-white line-art
      interior pages arranged in an aesthetic 2x2 grid collage on a bright wooden
      surface with colored pencils.
    preview_5: Generate a warm aesthetic lifestyle photograph featuring a physical
      paperback copy of the book '{title}'. The attached image is the OUTSIDE FRONT
      COVER. Display the physical book showing this exact cover image on a cozy desk
      next to house plants, watercolor set, and soft morning sunlight.
subjects:
- A peaceful tree of life surrounded by fluttering butterflies and blooming wildflowers.
- A cozy owl sitting on a thick branch of a mandala-patterned tree under a crescent
  moon.
- A tall tree with roots weaving into a circle around swimming koi fish.
- A friendly squirrel gathering acorns under a lush tree with leaf patterns.
- A majestic tree growing inside a giant sunburst mandala.
- A mother deer and her fawn standing beneath a blooming cherry blossom tree.
- A tree of life with heart-shaped leaves surrounded by floating sea turtles.
- A whimsical tree with spiral branches filled with singing woodland birds.
- A starry night sky framed by the leafy branches of a peaceful mandala tree.
- A happy hummingbird sipping nectar from flowers on a tree of life.
cover_text:
  back_blurb: '

    '
backend: web
api:
  key_env: GEMINI_API_KEY
  image_model: gemini-2.5-flash-image
  text_model: gemini-2.5-flash
  timeout: 180
  delay_between_prompts:
  - 2
  - 5
browser:
  headless: false
  gemini_url: https://gemini.google.com/app
  generation_timeout: 240
  recycle_tab_every: 5
  stall_timeout: 120
  max_requeue: 2
  delay_between_prompts:
  - 3
  - 7
  typing_delay_ms: 1
  max_retries: 3
  model_hint: ''
  profiles:
  - ./.chrome-account1
  concurrency_per_profile: 2
paths:
  raw_dir: output/01_raw
  processed_dir: output/02_processed
  pdf_dir: output/03_pdf
  state_file: output/state.json
_book: tree-of-life-mandala-coloring-book-inspirational-nature-desi
