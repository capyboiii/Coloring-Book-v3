book:
  title: Woodland Forest Xmas Coloring Book – Deer, Pine Cones, Owls & Snow – Print
    + Digital Editions – For Budding Artists
  subtitle: ''
  audience: kids
  cover_style: gouache
  num_images: 4
  blank_verso: true
  matter_pages: true
