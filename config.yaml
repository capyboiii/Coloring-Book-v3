book:
  title: Cute Dino Coloring
  subtitle: ''
  author: ''
  num_images: 30
  blank_verso: true
  front_matter_pages: 0
print:
  trim_width: 8.5
  trim_height: 11
  bleed: 0.125
  safety_margin: 0.5
  gutter: 0.375
  dpi: 300
  paper_thickness: 0.002252
  binding: perfect
  min_pages: 32
  cover_wrap: 0.25
  spine_width: 0.0
  full_bleed_interior: false
  interior_border: true
process:
  pure_bw: false
prompts:
  page: 'A black and white line-art coloring page illustration for children ages 4-8.

    Subject: {subject}.

    ABSOLUTELY NO BORDER: no frame, no rectangle or box around the drawing,

    no outline along the edges of the image, no decorative margin, no rounded

    corners, no torn-paper or sketchbook edge, no drop shadow, no vignette.

    The white background must extend cleanly all the way to every edge of the

    image, with nothing drawn at the edges.

    NO TEXT of any kind: no title, no caption, no letters, numbers, page number,

    signature, watermark or logo.

    Line work: pure black outlines on a pure white background, uniform thick

    strokes, closed shapes with large open areas that are easy to colour in.

    NO shading, NO hatching, NO stippling, NO gray tones, NO fill, NO colour.

    Composition: one single centred illustration, drawn as isolated artwork on

    plain white, with a small even area of empty white space around it. Vertical

    portrait orientation, aspect ratio 8.5:11. Maximum resolution, crisp

    vector-like edges.

    '
  cover_style: 'Art style: cheerful children''s picture-book illustration, soft rounded

    cartoon shapes, bold clean outlines, flat colours with gentle soft shading.

    NO photorealism, NO 3D render, NO glossy plastic look, NO harsh contrast.

    Colour palette: use ONLY these colours and their light/dark variations -

    leaf green #7FB77E, warm cream #F1F0C0, sky blue #A8DADC,

    soft coral #F4A896, warm brown #8D6E63, off-white #FFFDF5.

    Lighting: flat, even, warm daylight. Same line weight and same rendering

    quality across the whole image.

    '
  front_cover: 'A vibrant full-colour FRONT COVER illustration for a children''s coloring

    book. Theme: {title}. One friendly hero character from the theme, placed in

    the lower two thirds, with a simple whimsical background.

    Keep the upper third visually calm and mostly empty so a title can be

    placed there later.

    {style}

    NO text, letters, numbers, logo or watermark anywhere in the image.

    Vertical portrait orientation, aspect ratio 8.5:11, maximum resolution.

    '
  nudge: 'Generate the image now. Output only the image itself, with no explanation

    and no text in your reply.

    '
  back_cover: 'Generate an image. Do NOT reply with words, do NOT describe what you
    will

    draw - output the picture itself.

    Create the matching BACK COVER for the same book, using EXACTLY the

    same colour palette, art style, line weight and character design as the

    front cover you just made. It must look like the same book.

    Theme: {title}. A simple background: a few small decorative elements from

    the theme (leaves, stars, paw prints) scattered around the EDGES only.

    The CENTRE must stay clean, calm and uncluttered so a text blurb can be

    placed there later.

    {style}

    NO text, letters, numbers, logo or watermark anywhere in the image.

    Vertical portrait orientation, aspect ratio 8.5:11, maximum resolution.

    '
  previews:
    preview_1: 'Generate a high-resolution professional 3D product mockup photograph
      of a paperback coloring book standing on a solid white background with a realistic
      soft shadow. I have ATTACHED the exact image file of the FRONT COVER. Render
      this ATTACHED cover image directly and accurately onto the front cover of the
      3D paperback book mockup. CRITICAL REQUIREMENT: Do NOT invent or generate any
      new illustrations or new text. Reproduce the attached front cover image with
      100% exact visual fidelity. Clean minimalist ecommerce product mockup.'
    preview_2: 'Generate a realistic photograph of an open paperback coloring book
      laying flat on a warm wooden table next to colored pencils and a cup of tea.
      I have ATTACHED the exact image files of the INTERIOR COLORING PAGES. Render
      these attached black-and-white line-art pages printed clearly on the open left
      and right pages of the book with 100% exact visual fidelity. CRITICAL REQUIREMENT:
      Do NOT add, modify, or remove any text, titles, captions, or drawings on the
      open pages. Showcase the exact attached black-and-white line-art drawings.'
    preview_3: 'Generate a close-up photograph of hands actively coloring an open
      page inside a coloring book with colored pencils. I have ATTACHED the exact
      image file of the INTERIOR COLORING PAGE. Render this attached line-art drawing
      printed on the page with 100% exact visual fidelity. CRITICAL REQUIREMENT: Do
      NOT add, modify, or remove any text, titles, words, or drawings on the page.
      Only realistic colored pencil shading applied within the existing attached line
      art.'
    preview_4: 'Generate a clean overhead flatlay photograph displaying a 2x2 grid
      collage of 4 interior coloring book pages on a bright wooden surface with colored
      pencils. I have ATTACHED the exact 4 image files of the INTERIOR COLORING PAGES.
      Render these 4 ATTACHED black-and-white line-art drawings clearly inside the
      2x2 grid layout, one attached page per grid slot. CRITICAL REQUIREMENT: Render
      the 4 attached interior line-art images with 100% exact visual fidelity. Do
      NOT generate or invent any new drawings or extra text. Maintain the exact line-art
      artwork from the 4 attached images.'
    preview_5: 'Generate a warm aesthetic lifestyle photograph featuring a physical
      paperback coloring book on a cozy wooden desk next to green house plants, watercolor
      pencils, and soft sunlight. I have ATTACHED the exact image file of the FRONT
      COVER. Display the physical book with this ATTACHED cover image printed clearly
      on the front cover. CRITICAL REQUIREMENT: Render the attached cover image with
      100% exact visual fidelity. Do NOT generate or modify any artwork or text on
      the book cover. Keep the cover design identical to the attached image.'
